# Grace Shop UAT deploy to Cloud Run (ZP-470).
# Workload Identity Federation only: no service-account key files.
# GCP resources come from ZP-467. Every Cloud Run service/job name MUST start
# with `grace-shop-`: the deploy SA's run.admin role is conditioned on it.
# Runbook: docs/deployment/deploy-uat.md
name: deploy-uat

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      run_seed:
        description: >-
          Also run `npm run init` (grace-shop-uat-seed) after migrations.
          One-time bootstrap only: it re-applies the spreadsheet product data
          and would overwrite later price edits.
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write

# One UAT environment: queue deploys, never cancel one half-way.
concurrency:
  group: deploy-uat
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: project-f4cd7300-6eb7-46cc-be3
  GCP_REGION: africa-south1
  WIF_PROVIDER: projects/266452509449/locations/global/workloadIdentityPools/grace-shop-uat/providers/github
  WIF_SERVICE_ACCOUNT: grace-shop-uat-deploy@project-f4cd7300-6eb7-46cc-be3.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: grace-shop-uat-run@project-f4cd7300-6eb7-46cc-be3.iam.gserviceaccount.com
  ARTIFACT_REGISTRY_HOST: africa-south1-docker.pkg.dev
  ARTIFACT_REGISTRY: africa-south1-docker.pkg.dev/project-f4cd7300-6eb7-46cc-be3/grace-shop-uat-docker
  IMAGE_NAME: grace-shop
  # Shared with Fieldstream: read-only state check here, never start/modify it.
  CLOUD_SQL_INSTANCE: fieldstream-uat-db
  CLOUD_SQL_CONNECTION: project-f4cd7300-6eb7-46cc-be3:africa-south1:fieldstream-uat-db
  CLOUD_RUN_SERVICE: grace-shop-uat
  MIGRATE_JOB: grace-shop-uat-migrate
  SEED_JOB: grace-shop-uat-seed
  ROLLUP_JOB: grace-shop-uat-analytics-rollup
  IMAGES_BUCKET: grace-shop-uat-images-266452509449
  # Secret Manager references (names only, never values).
  DB_SECRETS: DATABASE_URL=grace-shop-uat-database-url:latest,DIRECT_URL=grace-shop-uat-direct-url:latest

jobs:
  # Same gate as PR CI. A red test stops the deploy.
  test:
    name: test
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
    with:
      # Push: lint what this push changed. Manual run: lint the last commit
      # (HEAD^), so the gate never silently skips.
      lint-base: ${{ github.event_name == 'push' && github.event.before || 'HEAD^' }}

  deploy:
    name: deploy-uat
    needs: test
    # Only master deploys to UAT. A manual run from another branch runs the
    # test job only.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Built BEFORE auth so the action's credentials file (written into the
      # workspace) can never end up in the Docker build context.
      - name: Build image
        run: |
          set -euo pipefail
          docker build -t "${ARTIFACT_REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" .

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Artifact Registry docker auth
        run: gcloud auth configure-docker "${ARTIFACT_REGISTRY_HOST}" --quiet

      - name: Push image, resolve immutable digest
        id: image
        run: |
          set -euo pipefail
          IMAGE="${ARTIFACT_REGISTRY}/${IMAGE_NAME}"
          docker push "${IMAGE}:${GITHUB_SHA}"
          DIGEST="$(gcloud artifacts docker images describe "${IMAGE}:${GITHUB_SHA}" \
            --project="${GCP_PROJECT_ID}" --format='get(image_summary.digest)')"
          if [[ -z "${DIGEST}" || "${DIGEST}" != sha256:* ]]; then
            echo "::error::Failed to resolve image digest for ${IMAGE}:${GITHUB_SHA}" >&2
            exit 1
          fi
          echo "image_ref=${IMAGE}@${DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "Deploying immutable image ${IMAGE}@${DIGEST}"

      - name: Check Cloud SQL instance is RUNNABLE (read-only)
        run: |
          set -euo pipefail
          STATE="$(gcloud sql instances describe "${CLOUD_SQL_INSTANCE}" \
            --project="${GCP_PROJECT_ID}" --format='value(state)')"
          if [[ "${STATE}" != "RUNNABLE" ]]; then
            echo "::error::Cloud SQL instance ${CLOUD_SQL_INSTANCE} is not RUNNABLE (state=${STATE:-unknown}). It is shared with Fieldstream, so this pipeline will not start or modify it. Ask the owner to start it, then re-run this workflow." >&2
            exit 1
          fi
          echo "Cloud SQL ${CLOUD_SQL_INSTANCE} is RUNNABLE."

      - name: Deploy migrate job
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
        run: |
          set -euo pipefail
          gcloud run jobs deploy "${MIGRATE_JOB}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${IMAGE_REF}" \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --set-cloudsql-instances="${CLOUD_SQL_CONNECTION}" \
            --set-secrets="${DB_SECRETS}" \
            --set-env-vars=NODE_ENV=production \
            --command=npm \
            --args=run,migrate \
            --tasks=1 \
            --max-retries=0 \
            --task-timeout=10m \
            --memory=1Gi \
            --cpu=1 \
            --quiet

      # prisma migrate deploy only. Never `db push` / `--force-reset` / `migrate reset`.
      - name: Execute migrate job (npm run migrate)
        run: |
          set -euo pipefail
          echo "Executing ${MIGRATE_JOB} (npm run migrate) against ${CLOUD_SQL_CONNECTION}"
          gcloud run jobs execute "${MIGRATE_JOB}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --wait

      # ZP-493: nightly analytics rollup. Deployed with every image so it runs
      # the same code as the web service; executed by analytics-rollup.yml.
      - name: Deploy analytics rollup job
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
        run: |
          set -euo pipefail
          gcloud run jobs deploy "${ROLLUP_JOB}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${IMAGE_REF}" \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --set-cloudsql-instances="${CLOUD_SQL_CONNECTION}" \
            --set-secrets="${DB_SECRETS}" \
            --set-env-vars="^@^NODE_ENV=production@GRACE_IMAGE_STORAGE=gcs@GRACE_IMAGE_BUCKET=${IMAGES_BUCKET}" \
            --command=npm \
            --args=run,analytics:rollup \
            --tasks=1 \
            --max-retries=1 \
            --task-timeout=15m \
            --memory=1Gi \
            --cpu=1 \
            --quiet

      # Manual, one-time bootstrap only (workflow_dispatch with run_seed=true).
      # Never on push: `npm run init` re-applies spreadsheet product data.
      - name: Deploy seed job
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_seed }}
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
        run: |
          set -euo pipefail
          gcloud run jobs deploy "${SEED_JOB}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${IMAGE_REF}" \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --set-cloudsql-instances="${CLOUD_SQL_CONNECTION}" \
            --set-secrets="${DB_SECRETS},GRACE_OWNER_PASSWORD=grace-shop-uat-owner-password:latest,GRACE_STAFF_PASSWORD=grace-shop-uat-staff-password:latest" \
            --set-env-vars=NODE_ENV=production,GRACE_OWNER_USERNAME=margie,GRACE_OWNER_FULLNAME=Margaret \
            --command=npm \
            --args=run,init \
            --tasks=1 \
            --max-retries=0 \
            --task-timeout=10m \
            --memory=1Gi \
            --cpu=1 \
            --quiet

      - name: Execute seed job (npm run init)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_seed }}
        run: |
          set -euo pipefail
          echo "Executing ${SEED_JOB} (npm run init)"
          gcloud run jobs execute "${SEED_JOB}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --wait

      # Candidate-first: an existing service gets the new revision with NO
      # traffic and the `candidate` tag; it is smoke-tested on the tag URL and
      # only then promoted. `gcloud run deploy --no-traffic` is rejected when
      # the service does not exist yet, so the very first deploy is a normal
      # one (there is no previous revision to protect).
      - name: Check whether the web service exists
        id: service
        run: |
          set -euo pipefail
          if OUT="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
              --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
              --format='value(metadata.name)' 2>&1)"; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "${CLOUD_RUN_SERVICE} exists: candidate-first deploy (--no-traffic --tag=candidate)."
          elif grep -qiE 'cannot find|could not be found|not[ _]found' <<<"${OUT}"; then
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "${CLOUD_RUN_SERVICE} does not exist yet: first deploy takes traffic directly."
          else
            echo "${OUT}" >&2
            echo "::error::Could not determine whether ${CLOUD_RUN_SERVICE} exists." >&2
            exit 1
          fi

      # --set-env-vars / --set-secrets replace the whole set on every deploy,
      # so nothing (e.g. ALLOW_SETUP) can linger from a manual change.
      # GRACE_QUICK_LOGIN: UAT quick sign-in (no password). Repository variable,
      # default 'false'. MUST be false before real data / go-live. See the runbook.
      # GRACE_STOREFRONT_HOSTS / GRACE_ADMIN_HOSTS (ZP-485): host-based routing,
      # comma-separated hostnames. Repository variables, default empty = admin
      # behaviour on every host (no change until a storefront domain exists).
      # Commas inside a value need gcloud's ^@^ delimiter syntax, used below.
      # GRACE_STOREFRONT_PREVIEW (ZP-481): 'true' serves the storefront design
      # preview at /site/preview (noindex). Repository variable, default 'false'
      # (the preview is a 404).
      - name: Deploy web service
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
          SERVICE_EXISTS: ${{ steps.service.outputs.exists }}
          GRACE_QUICK_LOGIN: ${{ vars.GRACE_QUICK_LOGIN || 'false' }}
          GRACE_STOREFRONT_HOSTS: ${{ vars.GRACE_STOREFRONT_HOSTS || '' }}
          GRACE_ADMIN_HOSTS: ${{ vars.GRACE_ADMIN_HOSTS || '' }}
          GRACE_STOREFRONT_PREVIEW: ${{ vars.GRACE_STOREFRONT_PREVIEW || 'false' }}
        run: |
          set -euo pipefail
          # Validate every repository variable that goes into --set-env-vars, so
          # none can smuggle in the ^@^ delimiter (i.e. extra env vars).
          if [[ ! "${GRACE_QUICK_LOGIN}" =~ ^(true|false)?$ ]]; then
            echo "::error::GRACE_QUICK_LOGIN must be 'true', 'false' or empty" >&2
            exit 1
          fi
          if [[ ! "${GRACE_STOREFRONT_PREVIEW}" =~ ^(true|false)?$ ]]; then
            echo "::error::GRACE_STOREFRONT_PREVIEW must be 'true', 'false' or empty" >&2
            exit 1
          fi
          for NAME in GRACE_STOREFRONT_HOSTS GRACE_ADMIN_HOSTS; do
            if [[ ! "${!NAME}" =~ ^[A-Za-z0-9.,:\ -]*$ ]]; then
              echo "::error::${NAME} must be a comma-separated list of hostnames" >&2
              exit 1
            fi
          done
          # --memory=1Gi (ZP-501, was 512Mi): product videos are transcoded in
          # the request with ffmpeg (~150 MB with 2 threads), and /tmp on Cloud
          # Run is in memory (upload <= 60 MB + output <= ~8 MB while processing).
          ARGS=(
            --project="${GCP_PROJECT_ID}"
            --region="${GCP_REGION}"
            --image="${IMAGE_REF}"
            --service-account="${RUNTIME_SERVICE_ACCOUNT}"
            --set-cloudsql-instances="${CLOUD_SQL_CONNECTION}"
            --set-secrets="${DB_SECRETS},JWT_SECRET=grace-shop-uat-jwt-secret:latest"
            --set-env-vars="^@^NODE_ENV=production@GRACE_IMAGE_STORAGE=gcs@GRACE_IMAGE_BUCKET=${IMAGES_BUCKET}@GRACE_QUICK_LOGIN=${GRACE_QUICK_LOGIN}@GRACE_STOREFRONT_HOSTS=${GRACE_STOREFRONT_HOSTS}@GRACE_ADMIN_HOSTS=${GRACE_ADMIN_HOSTS}@GRACE_STOREFRONT_PREVIEW=${GRACE_STOREFRONT_PREVIEW}"
            --port=8080
            --startup-probe=httpGet.path=/api/health,httpGet.port=8080,periodSeconds=5,timeoutSeconds=3,failureThreshold=24
            --min-instances=0
            --max-instances=2
            --memory=1Gi
            --cpu=1
            --allow-unauthenticated
            --quiet
          )
          if [[ "${SERVICE_EXISTS}" == "true" ]]; then
            ARGS+=(--no-traffic --tag=candidate)
          fi
          gcloud run deploy "${CLOUD_RUN_SERVICE}" "${ARGS[@]}"

      - name: Smoke test candidate (tag URL, no traffic yet)
        if: ${{ steps.service.outputs.exists == 'true' }}
        run: |
          set -euo pipefail
          CANDIDATE_URL="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format=json \
            | jq -r '.status.traffic[]? | select(.tag == "candidate") | .url' | head -n1)"
          if [[ -z "${CANDIDATE_URL}" || "${CANDIDATE_URL}" == "null" ]]; then
            echo "::error::Could not resolve the candidate tag URL" >&2
            exit 1
          fi
          bash .github/scripts/smoke-test.sh "${CANDIDATE_URL}" candidate

      # Also un-pins traffic left on a fixed revision by a manual rollback.
      - name: Promote candidate (send 100% traffic to latest)
        if: ${{ steps.service.outputs.exists == 'true' }}
        run: |
          set -euo pipefail
          gcloud run services update-traffic "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
            --to-latest --quiet

      - name: Verify traffic and smoke test service URL
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
        run: |
          set -euo pipefail
          SVC_JSON="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format=json)"
          URL="$(jq -r '.status.url // empty' <<<"${SVC_JSON}")"
          LATEST="$(jq -r '.status.latestReadyRevisionName // empty' <<<"${SVC_JSON}")"
          SERVING="$(jq -r '[.status.traffic[]? | select((.percent // 0) == 100)] | first
            | if . == null then "" elif .latestRevision == true then "latest" else (.revisionName // "") end' <<<"${SVC_JSON}")"
          if [[ -z "${URL}" ]]; then
            echo "::error::Could not resolve the ${CLOUD_RUN_SERVICE} URL" >&2
            exit 1
          fi
          if [[ "${SERVING}" != "latest" && "${SERVING}" != "${LATEST}" ]]; then
            echo "::error::100% of traffic is not on the new revision ${LATEST} (serving: ${SERVING:-split})" >&2
            exit 1
          fi
          echo "Service URL: ${URL}"
          echo "Serving revision: ${LATEST} (100%)"
          bash .github/scripts/smoke-test.sh "${URL}" service

          {
            echo "### Grace Shop UAT deployed"
            echo ""
            echo "- URL: ${URL}"
            echo "- Revision: \`${LATEST}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Image: \`${IMAGE_REF}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
